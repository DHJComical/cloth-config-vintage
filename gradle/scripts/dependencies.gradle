apply from: 'gradle/scripts/helpers.gradle'

repositories {
    flatDir {
        dirs('libs')
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    mavenCentral()
    mavenLocal()
}

dependencies {
    if (propertyBool('enable_lwjglx')) {
        compileOnly "com.cleanroommc:lwjglx:1.0.0"
    }

    compileOnly "org.jetbrains:annotations:24.1.0"

    shaded "me.shedaniel.cloth:basic-math:0.6.1"
    shaded "blue.endless:jankson:1.2.0"
    shaded("com.moandjiezana.toml:toml4j:0.7.2") {
        exclude(module: "gson")
    }
    shaded "org.yaml:snakeyaml:1.27"
}

tasks.named("shadowJar").configure {
    relocate "me.shedaniel.math", "${propertyString('root_package')}.clothconfig.shadowed.me.shedaniel.math"
    relocate "blue.endless.jankson", "${propertyString('root_package')}.clothconfig.shadowed.blue.endless.jankson"
    relocate "com.moandjiezana.toml", "${propertyString('root_package')}.clothconfig.shadowed.com.moandjiezana.toml"
    relocate "org.yaml.snakeyaml", "${propertyString('root_package')}.clothconfig.shadowed.org.yaml.snakeyaml"
}
