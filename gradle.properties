# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Source Options
use_modern_java_syntax = false
use_jetbrains_annotations = true

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = false
show_testing_output = false

# Mod Information
mod_version = 26.1.0
root_package = me.shedaniel.cloth
mod_id = cloth_config
mod_name = Cloth Config v26.1 API

# Mod Metadata
mod_description = An API for config screens.
mod_url = https://minecraft.curseforge.com/projects/cloth-config
mod_update_json =
mod_authors = shedaniel, DHJComical
mod_credits =
mod_logo_path =
mod_license = GNU LGPLv3
mod_issue_tracker_url = https://github.com/shedaniel/ClothConfig/issues
mod_icon_path = icon.png
mod_icon_item =
mod_background_path =

# Mapping Properties
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = true

# Run Configurations
minecraft_username = Dev
extra_jvm_args =
extra_tweak_classes =

# Maven Publishing
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# Publishing
release_type = release
publish_with_changelog = ${{ it.file('CHANGELOG.md').exists() }}
publish_to_curseforge = false
curseforge_project_id =
curseforge_debug = false
publish_to_modrinth = false
modrinth_project_id =
modrinth_sync_readme = false
modrinth_debug = false

# Modify Minecraft Sources
change_minecraft_sources = false

# Tags
use_tags = false
tag_class_name = ${root_package}.${mod_id}.Tags

# Access Transformers
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# Mixins
use_mixins = true
mixin_booter_version = 10.7
generate_mixins_json = false
mixin_configs = ${mod_id}
mixin_refmap = mixins.${mod_id}.refmap.json
mixin_package = me.shedaniel.clothconfig2.mixin

# Coremods
is_coremod = false
coremod_includes_mod = false
coremod_plugin_class_name =

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5
